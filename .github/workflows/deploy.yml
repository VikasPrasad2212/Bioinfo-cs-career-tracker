name: Automated Data Update & GitHub Pages Deploy

on:
  schedule:
    # Runs automatically every 12 hours (at 00:00 and 12:00 UTC)
    - cron: '0 0,12 * * *'
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger button in GitHub UI

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and committing updated data
permissions:
  contents: write
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  update-data-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Fetch Live Data from External Biological Repositories
        run: node scripts/fetch_live_data.js

      - name: Commit and Push Updated Data (if changed)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/live_feed.json src/data/live_feed.json || true
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): automated bioinformatics feed sync [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || echo "Push skipped"
          fi

      - name: Build Vite Production Assets
        run: npx vite build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
